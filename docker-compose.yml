# Sized for a small host. Measured peak RSS of the stitch step, which dominates
# everything else the bot does:
#
#   1080p, 3 inputs   ~1030 MB      720p, 3 inputs   ~495 MB
#   1080p, 4 inputs   ~1200 MB      720p, 4 inputs   ~615 MB
#   1080p, 5 inputs   ~1450 MB      720p, 5 inputs   ~705 MB
#
# STITCH_BATCH controls how many segments one ffmpeg call holds open at once, so it is
# the memory dial. A single call with all 20 clips would need roughly 4.5 GB and get
# OOM-killed on an 8 GB box — hence the batching.
#
# The settings below are 720p with STITCH_BATCH=5, estimated near 1.5 GB including Node.
#
# 1080p was tried first and did not survive contact with real footage: synthetic clips
# peaked around 1 GB at batch 3, while actual gameplay drove the container past a 3 GB
# limit and ffmpeg was OOM-killed. High-motion H.264 retains far more reference data
# than a test pattern, and a compilation of re-encoded clips gains little from 1080p.
#
# The 3 GB limit is a ceiling, not a reservation: the container only uses what ffmpeg
# actually asks for, so the headroom costs nothing and keeps the kernel out of it.
#
# For half the memory and roughly twice the speed, uncomment the 720p block.

services:
  stitch:
    build: .
    container_name: stitch
    restart: unless-stopped
    # Dokploy writes the variables from its Environment tab into a .env beside this
    # file, so the same compose works locally and there.
    env_file: .env

    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      # Node itself never holds video in memory; ffmpeg is a separate process.
      NODE_OPTIONS: --max-old-space-size=256

      # --- resource dials ---
      STITCH_BATCH: 5
      FFMPEG_THREADS: 2
      INGEST_CONCURRENCY: 1
      X264_PRESET: veryfast

      # 720p. 1080p at batch 3 was OOM-killed on real gameplay footage even with a 3 GB
      # limit — a test pattern peaked at 1 GB, the real thing exceeded 3. This halves the
      # pixel count and roughly halves encode time; batch 5 also folds 20 clips in two
      # tree levels instead of three, so it is faster again.
      OUTPUT_WIDTH: 1280
      OUTPUT_HEIGHT: 720

      # --- disk ---
      # Discord's own upload cap is 500 MB with Nitro; 200 MB skips the rare huge file.
      MAX_DOWNLOAD_BYTES: 209715200
      # Refuse to start a download below this much free space on the volume.
      MIN_FREE_DISK_MB: 3072
      # Delete source clips once their reel is uploaded — important for long backfills.
      CLEANUP_SOURCES: 'true'

      # --- backfill pacing ---
      # YouTube allows 10,000 quota units/day and an upload costs 1,600, so six uploads
      # is the hard daily ceiling. Five leaves room for the API calls around them.
      BACKFILL_MAX_REELS: 5

    volumes:
      # SQLite database, downloaded clips, finished reels. Back this up.
      #
      # A named volume rather than a bind mount: Docker seeds a named volume from the
      # image, ownership included, so the unprivileged app user can write to it with no
      # setup. A host bind mount (`./data:/app/data`) arrives owned by root and would
      # fail with EACCES — the entrypoint fixes that case too, but the volume needs no
      # fixing in the first place.
      #
      # To use a host directory instead, swap the line below for `- ./data:/app/data`.
      - stitch-data:/app/data

    deploy:
      resources:
        limits:
          # Above the measured 1080p/batch-3 peak with headroom for Node and the OS.
          memory: 3072M
          cpus: '2.0'
        reservations:
          memory: 256M

    # Compose v2 standalone ignores deploy.resources; these are the equivalent.
    mem_limit: 3072m
    mem_reservation: 256m
    cpus: 2.0

    # ffmpeg is the only thing that should ever be slow. Keeping it off the CPU when
    # something else on the host needs it costs a few minutes on a weekly job.
    cpu_shares: 512

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  stitch-data:
