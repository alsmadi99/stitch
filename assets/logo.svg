<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stitch logo: a friendly creature made of film strips sewn together">
  <title>Stitch</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BC8F5"/>
      <stop offset="1" stop-color="#3B6FE0"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB4EA"/>
      <stop offset="1" stop-color="#2F58C4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE0FF"/>
      <stop offset="1" stop-color="#5A6BF0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0E1533"/>
  <circle cx="256" cy="262" r="176" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="26 20" opacity="0.55"/>

  <!-- ears, angled like the two clips being joined -->
  <g fill="url(#ear)">
    <path d="M150 152c-26-44-22-84 6-92 27-8 52 22 62 74z"/>
    <path d="M362 152c26-44 22-84-6-92-27-8-52 22-62 74z"/>
  </g>

  <!-- head -->
  <path d="M256 122c78 0 132 54 132 128 0 76-58 128-132 128s-132-52-132-128c0-74 54-128 132-128z" fill="url(#body)"/>

  <!-- the seam: two clips joined, with the stitching that holds the join -->
  <path d="M256 124v34M256 352v26" stroke="#0E1533" stroke-width="6" opacity="0.4"/>
  <g stroke="#EAF6FF" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <path d="M240 136l32 18"/>
    <path d="M240 166l32 18"/>
    <path d="M240 336l32 18"/>
    <path d="M240 366l32 18"/>
  </g>

  <!-- film perforations down each cheek -->
  <g fill="#0E1533" opacity="0.28">
    <rect x="150" y="196" width="22" height="16" rx="5"/>
    <rect x="150" y="240" width="22" height="16" rx="5"/>
    <rect x="150" y="284" width="22" height="16" rx="5"/>
    <rect x="340" y="196" width="22" height="16" rx="5"/>
    <rect x="340" y="240" width="22" height="16" rx="5"/>
    <rect x="340" y="284" width="22" height="16" rx="5"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="206" cy="232" rx="30" ry="34" fill="#0E1533"/>
    <ellipse cx="306" cy="232" rx="30" ry="34" fill="#0E1533"/>
    <circle cx="215" cy="221" r="10" fill="#FFFFFF"/>
    <circle cx="315" cy="221" r="10" fill="#FFFFFF"/>
  </g>

  <!-- grin -->
  <path d="M212 300c14 22 30 33 44 33s30-11 44-33" fill="none" stroke="#0E1533" stroke-width="12" stroke-linecap="round"/>
</svg>
